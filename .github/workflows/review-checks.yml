name: Review checks — Miraj Ostadh
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/first-grade-resources-dark-mode, feature/edit-teacher-grade-profile, feature/edit-first-grade-timetable, feature/timetable-visual-refresh, feature/schedule-release-qa, feature/daily-journal-workspace, feature/teacher-professional-card, feature/journal-integrated-home]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
