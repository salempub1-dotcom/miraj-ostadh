name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://miraj-ostadh-elmiraj1.vercel.app/api/health"
          BODY=""
          for attempt in $(seq 1 24); do
            echo "Health attempt ${attempt}/24"
            BODY="$(curl -fsS --max-time 15 "$URL" || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"healthy":true'; then
              echo "Production health is OK."
              exit 0
            fi
            sleep 10
          done
          echo "Production health did not become healthy in time."
          exit 1

      - name: Verify registration page loads
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            "https://miraj-ostadh-elmiraj1.vercel.app/register" \
            -o /tmp/register.html
          test -s /tmp/register.html
          echo "Registration page returned successfully."
